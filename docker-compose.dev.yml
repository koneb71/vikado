# Development with hot reload: Vite proxying /api to the server.
# Run only the frontend with:  docker compose -f docker-compose.dev.yml up web
#
# Host ports are overridable because :3000 and :5173 are heavily contested
# defaults. Set them in .env or inline:
#   VIKADO_DEV_PORT=3010 VIKADO_WEB_PORT=51732 docker compose -f docker-compose.dev.yml up
# The default differs from docker-compose.yml's 3005 on purpose, so running
# the dev stack does not fight a production container already up.
# The CONTAINER port stays 3000 — VIKADO_API_URL below addresses the service
# over the compose network, so it must not follow the host port.
services:
  web:
    image: node:22-slim
    working_dir: /app/web
    command: sh -c "corepack enable && pnpm install && pnpm dev --host"
    ports:
      # host and container port are deliberately the SAME: Vite derives its HMR
      # websocket URL from the browser's location, so a remapped port would
      # have the client dialling a port the dev server is not on.
      - "${VIKADO_WEB_PORT:-51731}:${VIKADO_WEB_PORT:-51731}"
    volumes:
      - ./web:/app/web
      - web-node-modules:/app/web/node_modules
    environment:
      # vite.config.ts reads PORT; keep it equal to the published port above
      PORT: "${VIKADO_WEB_PORT:-51731}"
      VIKADO_API_URL: http://server:3000

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: cargo watch -x 'run -p vikado-server'
    ports:
      - "${VIKADO_DEV_PORT:-3006}:3000"
    volumes:
      - .:/app
      - cargo-target:/app/target
      - vikado-dev-data:/data
    environment:
      VIKADO_DATA_DIR: /data

volumes:
  web-node-modules:
  cargo-target:
  vikado-dev-data:
